<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cisco Networking Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #0f1525;
    --border: #1e3a5f;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff6b35;
    --text: #c8d8e8;
    --muted: #4a6080;
    --correct: #00ff9d;
    --wrong: #ff4466;
    --card: #111827;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Exo 2', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(0,212,255,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(0,255,157,0.04) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(30,58,95,0.15) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(30,58,95,0.15) 40px);
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(15,21,37,0.95);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 100;
    overflow: hidden;
  }

  .logo-icon {
    width: 36px; height: 36px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    box-shadow: 0 0 12px rgba(0,212,255,0.3);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }
  header h1 span { color: var(--accent); }

  .progress-bar-outer {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 1;
    min-width: 0;
  }

  .progress-bar-track {
    width: 100px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 1;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .main {
    max-width: 820px;
    margin: 24px auto;
    padding: 0 12px 120px;
  }

  /* START SCREEN */
  .start-screen {
    text-align: center;
    padding: 60px 20px;
  }
  .start-screen .big-icon {
    font-size: 64px;
    margin-bottom: 24px;
    display: block;
  }
  .start-screen h2 {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 12px;
  }
  .start-screen h2 span { color: var(--accent); }
  .start-screen p {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 32px;
    line-height: 1.7;
  }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .stat-box {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 10px;
    padding: 16px 28px;
    text-align: center;
  }
  .stat-box .num {
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
  }
  .stat-box .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  /* QUESTION CARD */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    animation: slideIn 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .q-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    padding: 3px 8px;
    letter-spacing: 1px;
  }
  .q-tag {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
  }
  .q-tag.multi {
    color: var(--warn);
    background: rgba(255,107,53,0.1);
    border: 1px solid rgba(255,107,53,0.3);
    border-radius: 4px;
    padding: 3px 8px;
  }

  .question-text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.65;
    color: #e8f0f8;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .match-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .match-column-title {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
    font-family: 'Share Tech Mono', monospace;
  }
  .match-item {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.02);
    transition: all 0.18s ease;
  }
  .match-item:hover:not(.locked) {
    border-color: rgba(0,212,255,0.5);
    background: rgba(0,212,255,0.05);
  }
  .match-item.active,
  .match-item.selected {
    border-color: var(--accent);
    background: rgba(0,212,255,0.08);
  }
  .match-item.pair-0.selected { border-color: #00d4ff; background: rgba(0,212,255,0.16); }
  .match-item.pair-1.selected { border-color: #00ff9d; background: rgba(0,255,157,0.16); }
  .match-item.pair-2.selected { border-color: #ffcc00; background: rgba(255,204,0,0.16); }
  .match-item.pair-3.selected { border-color: #ff6b35; background: rgba(255,107,53,0.16); }
  .match-item.pair-4.selected { border-color: #8b5cf6; background: rgba(139,92,246,0.16); }
  .match-item.correct {
    border-color: var(--correct);
    background: rgba(0,255,157,0.18);
    box-shadow: 0 0 10px rgba(0,255,157,0.25), inset 0 0 8px rgba(0,255,157,0.08);
  }
  .match-item.wrong {
    border-color: var(--wrong);
    background: rgba(255,68,102,0.18);
    box-shadow: 0 0 10px rgba(255,68,102,0.25), inset 0 0 8px rgba(255,68,102,0.08);
  }
  .match-item.correct .match-index {
    border-color: var(--correct);
    background: var(--correct);
    color: #000;
    font-weight: 700;
  }
  .match-item.wrong .match-index {
    border-color: var(--wrong);
    background: var(--wrong);
    color: #fff;
    font-weight: 700;
  }
  .match-item.correct .match-label { color: var(--correct); }
  .match-item.wrong .match-label   { color: var(--wrong); }

  .match-status-icon {
    margin-left: auto;
    font-size: 18px;
    flex-shrink: 0;
  }
  .match-correct-hint {
    font-size: 11px;
    color: var(--correct);
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.5px;
  }
  .match-index {
    width: 30px;
    min-width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s ease;
    background: rgba(255,255,255,0.02);
    user-select: none;
  }
  .option:hover:not(.locked) {
    border-color: rgba(0,212,255,0.5);
    background: rgba(0,212,255,0.05);
  }
  .option.selected {
    border-color: var(--accent);
    background: rgba(0,212,255,0.08);
  }
  .option.correct {
    border-color: var(--correct);
    background: rgba(0,255,157,0.08);
  }
  .option.wrong {
    border-color: var(--wrong);
    background: rgba(255,68,102,0.08);
  }
  .option.missed {
    border-color: rgba(0,255,157,0.4);
    background: rgba(0,255,157,0.04);
    opacity: 0.7;
  }

  .checkbox {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    transition: all 0.18s;
  }
  .option.selected .checkbox {
    border-color: var(--accent);
    background: var(--accent);
    color: #000;
  }
  .option.correct .checkbox {
    border-color: var(--correct);
    background: var(--correct);
    color: #000;
  }
  .option.wrong .checkbox {
    border-color: var(--wrong);
    background: var(--wrong);
    color: #fff;
  }
  .option.missed .checkbox {
    border-color: var(--correct);
  }

  .option-text {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
    flex: 1;
  }
  .option.correct .option-text { color: var(--correct); }
  .option.wrong .option-text { color: var(--wrong); }

  /* FEEDBACK */
  .feedback {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 10px;
    animation: fadeUp 0.2s ease;
  }
  .feedback.show { display: flex; }
  .feedback.correct-fb { background: rgba(0,255,157,0.08); border: 1px solid rgba(0,255,157,0.3); color: var(--correct); }
  .feedback.wrong-fb   { background: rgba(255,68,102,0.08); border: 1px solid rgba(255,68,102,0.3); color: var(--wrong); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* BUTTONS — always-visible sticky footer */
  .btn-row {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 90;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    align-items: center;
    padding: 18px 16px;
    padding-bottom: max(18px, env(safe-area-inset-bottom));
    background: rgba(10,14,26,0.97);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .btn-row::-webkit-scrollbar { display: none; }

  .question-nav {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-row-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
  }

  .select-jump {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 6px;
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    min-width: 90px;
    max-width: 110px;
    flex-shrink: 1;
  }
  .select-jump:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  .btn {
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #0088bb);
    color: #000;
    box-shadow: 0 4px 16px rgba(0,212,255,0.25);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,255,0.35); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-success {
    background: linear-gradient(135deg, var(--accent2), #009960);
    color: #000;
    box-shadow: 0 4px 16px rgba(0,255,157,0.2);
  }
  .btn-success:hover { transform: translateY(-1px); }

  /* RESULTS */
  .results-screen {
    text-align: center;
    padding: 40px 20px;
    animation: slideIn 0.4s ease;
  }
  .score-ring {
    width: 160px; height: 160px;
    border-radius: 50%;
    margin: 0 auto 28px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    position: relative;
  }
  .score-ring svg {
    position: absolute;
    top: 0; left: 0;
    transform: rotate(-90deg);
  }
  .score-ring .inner {
    position: relative;
    z-index: 1;
  }
  .score-ring .pct {
    font-size: 42px;
    font-weight: 900;
    font-family: 'Share Tech Mono', monospace;
    line-height: 1;
  }
  .score-ring .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .results-screen h2 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .results-screen p { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  .result-stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .result-stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 24px;
    min-width: 100px;
  }
  .result-stat .val { font-size: 24px; font-weight: 900; font-family: 'Share Tech Mono', monospace; }
  .result-stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .result-stat.c .val { color: var(--correct); }
  .result-stat.w .val { color: var(--wrong); }

  /* ANSWER KEY */
  .answer-key {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    margin-top: 40px;
    text-align: left;
  }
  .answer-key h3 {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    font-family: 'Share Tech Mono', monospace;
  }
  .ak-item {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(30,58,95,0.5);
    font-size: 13px;
  }
  .ak-item:last-child { border-bottom: none; }
  .ak-num { color: var(--muted); font-family: 'Share Tech Mono', monospace; min-width: 32px; }
  .ak-ans { color: var(--correct); }

  /* HIDDEN */
  .hidden { display: none !important; }

  /* ── Mobile (iPhone 13 mini = 375px) ── */
  @media (max-width: 430px) {
    header h1 { font-size: 14px; letter-spacing: 1px; }

    .question-text { font-size: 15px; }
    .option { padding: 12px 12px; gap: 10px; }
    .option-text { font-size: 13.5px; }

    .match-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .match-item { padding: 10px 10px; gap: 8px; }
    .match-label { font-size: 12px; }
    .match-index { width: 26px; min-width: 26px; height: 26px; font-size: 11px; }

    .btn-row-divider { display: none; }

    .start-screen h2 { font-size: 24px; }
    .stat-box { padding: 12px 16px; }
    .stat-box .num { font-size: 22px; }
    .stats-row { gap: 12px; }

    .answer-key { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">NET</div>
  <h1>CCNA <span>ITN</span> Final Exam 1</h1>
  <div class="progress-bar-outer" id="headerProgress" style="display:none">
    <span id="progressText">0 / 50</span>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>
</header>

<div class="main">

  <!-- START SCREEN -->
  <div id="startScreen" class="start-screen">
    <span class="big-icon">🖥️</span>
    <h2>Cisco <span>Networking</span> Fundamentals</h2>
    <p><span id="introCount">100</span> questions covering OSI model, TCP/IP, subnetting, protocols,<br>security, and Cisco IOS configuration.</p>
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="questionTotal">100</div><div class="label">Questions</div></div>
      <div class="stat-box"><div class="num">~60</div><div class="label">Minutes</div></div>
      <div class="stat-box"><div class="num">Mixed</div><div class="label">Single & Multi</div></div>
    </div>
    <div style="margin:12px 0; display:flex; gap:8px; align-items:center; justify-content:center; width:100%;">
      <button class="btn btn-primary" onclick="startQuiz(false)">▶ START</button>
      <button class="btn" onclick="startQuiz(true)">▶ START (Random)</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="hidden">
    <div class="question-card" id="questionCard"></div>
    <div class="btn-row" id="btnRow"></div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="resultsScreen" class="hidden"></div>

</div>

<script>
const questions = [
  {
    q: "A client packet is received by a server. The packet has a destination port number of 143. What service is the client requesting?",
    opts: ["Telnet","SSH","IMAP","FTP"],
    ans: [2]
  },
  {
    q: "Which two functions are performed at the MAC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.) —> Case A",
    opts: [
      "applies delimiting of Ethernet frame fields to synchronize communication between nodes",
      "applies source and destination MAC addresses to Ethernet frame",
      "places information in the Ethernet frame that identifies which network layer protocol is being encapsulated by the frame",
      "handles communication between upper layer networking software and Ethernet NIC hardware",
      "adds Ethernet control information to network protocol data"
    ],
    ans: [0,1]
  },
  {
    q: "Which two functions are performed at the MAC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.) —> Case B",
    opts: [
      "implements a process to delimit fields within an Ethernet 2 frame",
      "implements trailer with frame check sequence for error detection",
      "handles communication between upper layer networking software and Ethernet NIC hardware",
      "adds Ethernet control information to network protocol data",
      "places information in the Ethernet frame that identifies which network layer protocol is being encapsulated by the frame"
    ],
    ans: [0,1]
  },
  {
    q: "Which two functions are performed at the MAC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.) —> Case C",
    opts: [
      "implements CSMA/CD over legacy shared half-duplex media",
      "integrates Layer 2 flows between 10 Gigabit Ethernet over fiber and 1 Gigabit Ethernet over copper",
      "handles communication between upper layer networking software and Ethernet NIC hardware",
      "adds Ethernet control information to network protocol data",
      "enables IPv4 and IPv6 to utilize the same physical medium"
    ],
    ans: [0,1]
  },
  {
    q: "A new network administrator has been asked to enter a banner message on a Cisco device. What is the fastest way a network administrator could test whether the banner is properly configured?",
    opts: [
      "Enter CTRL-Z at the privileged mode prompt.",
      "Power cycle the device.",
      "Exit privileged EXEC mode and press Enter.",
      "Exit global configuration mode.",
      "Reboot the device."
    ],
    ans: [2]
  },
  {
    q: "What happens when the transport input ssh command is entered on the switch vty lines?",
    opts: [
      "The switch requires a username/password combination for remote access.",
      "The SSH client on the switch is enabled.",
      "Communication between the switch and remote users is encrypted.",
      "The switch requires remote connections via a proprietary client software."
    ],
    ans: [2]
  },
  {
    q: "What is the subnet ID associated with the IPv6 address 2001:DA48:FC5:A4:3D1B::1/64?",
    opts: [
      "2001:DA48::/64",
      "2001::/64",
      "2001:DA48:FC5:A4::/64",
      "2001:DA48:FC5::A4:/64"
    ],
    ans: [2]
  },
  {
    q: "A client is using SLAAC to obtain an IPv6 address for its interface. After an address has been generated and applied to the interface, what must the client do before it can begin to use this IPv6 address?",
    opts: [

// preserve original order index for optional restore
questions.forEach((q,i)=> q._originalIndex = i);

const introCount = document.getElementById('introCount');
const questionTotal = document.getElementById('questionTotal');
if (introCount) introCount.textContent = questions.length;
if (questionTotal) questionTotal.textContent = questions.length;

let current = 0;
let selected = [];
let activeMatch = -1;
let matchSelections = [];
let answered = false;
let score = 0;
let results = [];

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startQuiz(shuffle = false) {
  try {
    questions.sort((a, b) => a._originalIndex - b._originalIndex);
  } catch (e) {
    console.warn('Restore original question order failed:', e);
  }

  if (shuffle) {
    try {
      const shuffled = shuffleArray(questions);
      questions.splice(0, questions.length, ...shuffled);
    } catch (e) {
      console.warn('Question shuffle failed:', e);
    }
  }

  current = 0; selected = []; activeMatch = -1; matchSelections = []; answered = false; score = 0; results = [];
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('headerProgress').style.display = 'flex';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  selected = [];
  if (q.type !== 'match') activeMatch = -1;
  if (q.type === 'match' && matchSelections.length !== q.left.length) {
    matchSelections = Array(q.left.length).fill(null);
  }
  answered = false;

  const isMatch = q.type === 'match';
  let opts = q.opts;
  let correct = q.ans;
  if (!isMatch) {
    if (!q._shuffle || q._shuffle.length !== q.opts.length) {
      const order = shuffleArray(q.opts.map((_, i) => i));
      q._shuffle = order;
      q._shuffledOpts = order.map(i => q.opts[i]);
      q._shuffledAns = q.ans.map(a => order.indexOf(a)).sort((a, b) => a - b);
    }
    opts = q._shuffledOpts;
    correct = q._shuffledAns;
  }
  const isMulti = !isMatch && correct.length > 1;
  const total = questions.length;

  document.getElementById('progressText').textContent = `${current + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${((current + 1) / total) * 100}%`;

  const jumpOptions = questions.map((_, i) => `
      <option value="${i}" ${i === current ? 'selected' : ''}>Q ${i + 1}</option>
    `).join('');

  let contentHTML = '';
  if (isMatch) {
    const leftItems = q.left.map((text, i) => {
      const classes = [];
      if (activeMatch === i) classes.push('active');
      const pairClass = matchSelections[i] !== null ? `pair-${matchSelections[i]}` : '';
      if (matchSelections[i] !== null) classes.push('selected');
      if (pairClass) classes.push(pairClass);
      return `
        <div class="match-item ${classes.join(' ')}" onclick="selectMatch('left', ${i})">
          <div class="match-index">${i + 1}</div>
          <div class="option-text match-label">${text}</div>
        </div>
      `;
    }).join('');
    const rightItems = q.right.map((text, j) => {
      const selectedBy = matchSelections.findIndex(v => v === j);
      const classes = [];
      const pairClass = selectedBy !== -1 ? `pair-${j}` : '';
      if (selectedBy !== -1) classes.push('selected');
      if (pairClass) classes.push(pairClass);
      return `
        <div class="match-item ${classes.join(' ')}" onclick="selectMatch('right', ${j})">
          <div class="match-index">${String.fromCharCode(65 + j)}</div>
          <div class="option-text match-label">${text}</div>
        </div>
      `;
    }).join('');
    contentHTML = `
      <div class="match-grid">
        <div class="match-column">
          <div class="match-column-title">Description</div>
          ${leftItems}
        </div>
        <div class="match-column">
          <div class="match-column-title">IP Address</div>
          ${rightItems}
        </div>
      </div>
    `;
  } else {
    const optionsHTML = opts.map((o, i) => `
      <div class="option" id="opt${i}" onclick="toggleOption(${i})">
        <div class="checkbox" id="chk${i}"></div>
        <div class="option-text">${o}</div>
      </div>
    `).join('');
    contentHTML = `<div class="options" id="options">${optionsHTML}</div>`;
  }

  document.getElementById('questionCard').innerHTML = `
    <div class="q-meta">
      <span class="q-num">Q ${current + 1} / ${total}</span>
      ${isMatch ? `<span class="q-tag">MATCH</span>` : isMulti ? `<span class="q-tag multi">⚡ CHOOSE ${q.ans.length}</span>` : '<span class="q-tag">SINGLE CHOICE</span>'}
    </div>
    <div class="question-text">${q.q.replace(/\n/g,'<br>')}</div>
    ${contentHTML}
    <div class="feedback" id="feedback"></div>
  `;

  const canSubmit = isMatch ? matchSelections.every(v => v !== null) : false;
  const btnRow = document.getElementById('btnRow');
  btnRow.innerHTML = `
    <button class="btn btn-ghost" onclick="prevQuestion()" ${current === 0 ? 'disabled' : ''}>← Prev</button>
    <select id="questionSelect" class="select-jump" onchange="goToQuestion(this.value)">
      ${jumpOptions}
    </select>
    <div class="btn-row-divider"></div>
    <button class="btn btn-ghost" onclick="returnToMenu()">Menu</button>
    <button class="btn btn-ghost" onclick="skipQuestion()">Skip</button>
    <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" ${canSubmit ? '' : 'disabled'}>Check Answer</button>
    <button class="btn btn-ghost" onclick="nextQuestion()" ${current === total - 1 ? 'disabled' : ''}>Next →</button>
  `;
}

function toggleOption(i) {
  if (answered) return;
  const q = questions[current];
  const isMulti = q.ans.length > 1;

  if (isMulti) {
    const idx = selected.indexOf(i);
    if (idx === -1) selected.push(i);
    else selected.splice(idx, 1);
  } else {
    selected = [i];
    document.querySelectorAll('.option').forEach(o => {
      o.classList.remove('selected');
      o.querySelector('.checkbox').textContent = '';
    });
  }

  document.querySelectorAll('.option').forEach((o, j) => {
    if (selected.includes(j)) {
      o.classList.add('selected');
      o.querySelector('.checkbox').textContent = '✓';
    } else {
      o.classList.remove('selected');
      o.querySelector('.checkbox').textContent = '';
    }
  });

  document.getElementById('submitBtn').disabled = selected.length === 0;
}

function selectMatch(side, index) {
  if (answered) return;
  const q = questions[current];
  if (q.type !== 'match') return;

  if (side === 'left') {
    activeMatch = index;
  } else if (side === 'right') {
    if (activeMatch === -1) return;
    matchSelections[activeMatch] = index;
    activeMatch = -1;
  }

  renderQuestion();
}

function submitAnswer() {
  const q = questions[current];
  if (answered || (q.type !== 'match' && selected.length === 0) || (q.type === 'match' && !matchSelections.every(v => v !== null))) return;
  answered = true;
  const correct = q.type === 'match' ? q.ans : (q._shuffledAns || q.ans);

  let isCorrect = false;
  if (q.type === 'match') {
    selected = [...matchSelections];
    isCorrect = q.ans.every(([left, right]) => selected[left] === right);
  } else {
    const sortedSel = [...selected].sort();
    const sortedCor = [...correct].sort();
    isCorrect = JSON.stringify(sortedSel) === JSON.stringify(sortedCor);
  }

  if (isCorrect) score++;
  results.push({ q: current, selected: q.type === 'match' ? [...matchSelections] : [...selected], correct: [...correct], isCorrect });

  if (q.type === 'match') {
    const leftCount = q.left.length;
    const correctMap = q.ans.reduce((map, [l, r]) => {
      map[l] = r;
      return map;
    }, {});
    const reverseCorrect = {};
    q.ans.forEach(([l, r]) => { reverseCorrect[r] = l; });

    document.querySelectorAll('.match-item').forEach((item, idx) => {
      item.classList.add('locked');
      item.style.cursor = 'default';

      if (idx < leftCount) {
        const leftIndex = idx;
        const selectedRight = matchSelections[leftIndex];
        const correctRight = correctMap[leftIndex];

        if (selectedRight === correctRight) {
          item.classList.add('correct');
          item.insertAdjacentHTML('beforeend', `<span class="match-status-icon">✅</span>`);
        } else if (selectedRight !== null) {
          item.classList.add('wrong');
          const correctLabel = String.fromCharCode(65 + correctRight);
          item.insertAdjacentHTML('beforeend', `<span class="match-status-icon">❌</span>`);
          item.insertAdjacentHTML('beforeend', `<div class="match-correct-hint">→ richtig: ${correctLabel}</div>`);
        }
      } else {
        const rightIndex = idx - leftCount;
        const leftIndex = matchSelections.findIndex(v => v === rightIndex);
        if (leftIndex !== -1) {
          if (correctMap[leftIndex] === rightIndex) item.classList.add('correct');
          else item.classList.add('wrong');
        }
      }
    });
  } else {
    document.querySelectorAll('.option').forEach((o, i) => {
      o.classList.add('locked');
      o.style.cursor = 'default';
      const chk = o.querySelector('.checkbox');
      if (correct.includes(i) && selected.includes(i)) {
        o.classList.remove('selected'); o.classList.add('correct');
        chk.textContent = '✓'; chk.style.color = '#000';
      } else if (selected.includes(i) && !correct.includes(i)) {
        o.classList.remove('selected'); o.classList.add('wrong');
        chk.textContent = '✗';
      } else if (correct.includes(i) && !selected.includes(i)) {
        o.classList.add('missed');
      } else {
        o.classList.remove('selected');
        chk.textContent = '';
      }
    });
  }

  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if (isCorrect) {
    fb.classList.add('correct-fb');
    fb.innerHTML = '✅ Richtig! Alle Zuordnungen korrekt.';
  } else {
    fb.classList.add('wrong-fb');
    if (q.type === 'match') {
      const correctMap = q.ans.reduce((map, [l, r]) => { map[l] = r; return map; }, {});
      const lines = q.left.map((leftText, i) => {
        const rightText = q.right[correctMap[i]];
        const chosen = matchSelections[i];
        const chosenText = chosen !== null ? q.right[chosen] : '—';
        const ok = chosen === correctMap[i];
        return `<div style="margin-top:6px;font-size:13px;">
          <span style="color:${ok ? 'var(--correct)' : 'var(--wrong)'}">${ok ? '✓' : '✗'}</span>
          <strong style="color:var(--text)">${i+1}.</strong>
          ${ok
            ? `<span style="color:var(--correct)">${leftText} → ${rightText}</span>`
            : `<span style="color:var(--wrong);text-decoration:line-through">${leftText} → ${chosenText}</span>
               <span style="color:var(--correct)"> → richtig: ${rightText}</span>`
          }
        </div>`;
      }).join('');
      fb.innerHTML = `<div><div>❌ Falsch — korrekte Zuordnungen:</div>${lines}</div>`;
    } else {
      fb.innerHTML = '❌ Falsch — richtige Antwort ist grün markiert.';
    }
  }

  const btnRow = document.getElementById('btnRow');
  const isLast = current === questions.length - 1;
  const jumpOpts = questions.map((_, i) => `<option value="${i}" ${i === current ? 'selected' : ''}>Q ${i + 1}</option>`).join('');
  btnRow.innerHTML = isLast
    ? `<button class="btn btn-ghost" onclick="prevQuestion()" ${current === 0 ? 'disabled' : ''}>← Prev</button>
       <select class="select-jump" onchange="goToQuestion(this.value)">${jumpOpts}</select>
       <div class="btn-row-divider"></div>
       <button class="btn btn-success" onclick="showResults()">View Results →</button>`
    : `<button class="btn btn-ghost" onclick="prevQuestion()" ${current === 0 ? 'disabled' : ''}>← Prev</button>
       <select class="select-jump" onchange="goToQuestion(this.value)">${jumpOpts}</select>
       <div class="btn-row-divider"></div>
       <button class="btn btn-primary" onclick="nextQuestion()">Next Question →</button>`;
}

function skipQuestion() {
  results.push({ q: current, selected: [], correct: questions[current].ans, isCorrect: false });
  nextQuestion();
}

function prevQuestion() {
  if (current === 0) return;
  current--;
  renderQuestion();
}

function goToQuestion(value) {
  const index = Number(value);
  if (!Number.isInteger(index) || index < 0 || index >= questions.length) return;
  current = index;
  renderQuestion();
}

function nextQuestion() {
  current++;
  if (current >= questions.length) { showResults(); return; }
  renderQuestion();
}

function showResults() {
  document.getElementById('quizScreen').classList.add('hidden');
  const rs = document.getElementById('resultsScreen');
  rs.classList.remove('hidden');

  const pct = Math.round((score / questions.length) * 100);
  const wrong = questions.length - score;
  let grade, color;
  if (pct >= 90) { grade = 'EXCELLENT'; color = '#00ff9d'; }
  else if (pct >= 75) { grade = 'GOOD PASS'; color = '#00d4ff'; }
  else if (pct >= 60) { grade = 'MARGINAL'; color = '#ffcc00'; }
  else { grade = 'NEEDS WORK'; color = '#ff4466'; }

  const r = 70; const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;

  let akRows = questions.map((q, i) => {
    const letters = ['A','B','C','D','E','F','G'];
    const ans = q.ans.map(a => letters[a]).join(', ');
    return `<div class="ak-item"><span class="ak-num">Q${i+1}</span><span class="ak-ans">${ans}</span></div>`;
  }).join('');

  rs.innerHTML = `
    <div class="results-screen">
      <div class="score-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="${r}" fill="none" stroke="#1e3a5f" stroke-width="10"/>
          <circle cx="80" cy="80" r="${r}" fill="none" stroke="${color}" stroke-width="10"
            stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
            style="transition: stroke-dasharray 1s ease;"/>
        </svg>
        <div class="inner">
          <div class="pct" style="color:${color}">${pct}%</div>
          <div class="label">Score</div>
        </div>
      </div>
      <h2 style="color:${color}">${grade}</h2>
      <p>${score} out of ${questions.length} questions answered correctly</p>
      <div class="result-stats">
        <div class="result-stat c"><div class="val">${score}</div><div class="lbl">Correct</div></div>
        <div class="result-stat w"><div class="val">${wrong}</div><div class="lbl">Wrong</div></div>
        <div class="result-stat"><div class="val" style="color:var(--accent)">${questions.length}</div><div class="lbl">Total</div></div>
      </div>
      <button class="btn btn-primary" onclick="restartQuiz()">↺ RESTART QUIZ</button>
      <div class="answer-key">
        <h3>// ANSWER KEY</h3>
        ${akRows}
      </div>
    </div>
  `;
}

function restartQuiz() {
  document.getElementById('resultsScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('headerProgress').style.display = 'none';
}

function returnToMenu() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('headerProgress').style.display = 'none';
}
</script>
</body>
</html>
